version: '3.8'

services:
  # MongoDB - Metadata Storage
  mongodb:
    image: mongo:7.0
    container_name: daylight-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: daylight
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - daylight-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO - Object Storage
  minio:
    image: minio/minio:latest
    container_name: daylight-minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - daylight-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client - Create buckets on startup
  minio-setup:
    image: minio/mc:latest
    container_name: daylight-minio-setup
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
      /usr/bin/mc mb myminio/daylight-storage --ignore-existing;
      /usr/bin/mc mb myminio/daylight-facts --ignore-existing;
      /usr/bin/mc mb myminio/daylight-slides --ignore-existing;
      /usr/bin/mc mb myminio/daylight-cache --ignore-existing;
      /usr/bin/mc anonymous set download myminio/daylight-storage;
      /usr/bin/mc anonymous set download myminio/daylight-facts;
      /usr/bin/mc anonymous set download myminio/daylight-slides;
      echo 'MinIO buckets created';
      "
    networks:
      - daylight-network

  # Metadata Service
  metadata-service:
    build:
      context: ./services/metadata-service
      dockerfile: Dockerfile
    container_name: daylight-metadata-service
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017/daylight?authSource=admin
      MONGODB_DB: daylight
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - daylight-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Storage Service
  storage-service:
    build:
      context: ./services/storage-service
      dockerfile: Dockerfile
    container_name: daylight-storage-service
    restart: unless-stopped
    ports:
      - "3002:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_USE_SSL: "false"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: daylight-storage
      MINIO_REGION: us-east-1
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      FALLBACK_ENABLED: ${FALLBACK_ENABLED:-true}
      PRIMARY_PROVIDER: ${PRIMARY_PROVIDER:-minio}
    depends_on:
      minio:
        condition: service_healthy
    networks:
      - daylight-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - Edge Caching
  redis:
    image: redis:7-alpine
    container_name: daylight-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - daylight-network
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  minio_data:
    driver: local
  redis_data:
    driver: local

networks:
  daylight-network:
    driver: bridge
